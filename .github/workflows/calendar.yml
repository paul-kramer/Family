name: iCloud-Kalender abholen

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kalender abholen und verschlüsseln
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          FAMILY_KEY: ${{ secrets.FAMILY_KEY }}
        run: node scripts/fetch-calendar.mjs
      - name: Änderung speichern
        run: |
          if [ -n "$(git status --porcelain calendar.enc.json)" ]; then
            git config user.name "familienzeit-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendar.enc.json
            git commit -m "Kalender aktualisiert"
            git push
          fi
